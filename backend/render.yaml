services:
  - type: web
    name: sentimentsage-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 60
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: sage_sentiment
      - key: CORS_ORIGINS
        value: https://sentiment-sage42984.vercel.app,https://sentiment-sage42984.netlify.app,http://localhost:5173,http://localhost:3000
      - key: YOUTUBE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: AI_ENABLED
        value: "True"
      - key: AI_PROVIDER
        value: openai
      - key: USE_MOCK_EMAIL
        value: "True"
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
